name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make web
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-only: true
          # Build with the Go from setup-go; the prebuilt binary is built with Go 1.24 and refuses go.mod's 1.26.
          install-mode: goinstall
      - run: make lint
      - run: make test

  # Slow (starts Cassandra containers): run it by hand from the Actions tab (Run workflow).
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cassandra: ["4.1", "5.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make web
      - run: make it CASSANDRA_VERSIONS=${{ matrix.cassandra }}
